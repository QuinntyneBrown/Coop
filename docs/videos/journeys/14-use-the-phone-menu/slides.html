<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey 14 Slides</title>
<link rel="stylesheet" href="../../assets/slides.css">
</head>
<body data-video-number="14" data-video-title="Use the phone menu" data-parts="Welcome|Open the menu|Close the menu|In short|Thank you">

<section id="title" data-part="0">
  <div class="cols">
    <div>
      <div class="kicker">Public journey · Co-op platform</div>
      <h1>Use the phone menu</h1>
      <p class="lead">Find your way on a small screen</p>
    </div>
    <img class="art" src="../../../mocks/assets/own/hero.svg" alt="A friendly apartment building with a garden and neighbours on a bench">
  </div>
</section>

<section id="closed" data-part="1" data-cue="At the top right of the page, you see a button that says Menu.">
  <div class="heading-row"><h2>1 · Tap “Menu”</h2></div>
  <div class="pics">
    <figure><img class="shot h640" src="images/public-landing-360.png" alt="The co-op home page on a phone, with a Menu button at the top right"><figcaption>Top right of the page</figcaption></figure>
  </div>
</section>

<section id="open" data-part="1" data-cue="A list opens.">
  <div class="heading-row"><h2>The links</h2></div>
  <div class="pics">
    <figure><img class="shot h640" src="images/public-landing-menu-360.png" alt="The open menu on a phone: Home, About us, Living here, What's on, Contact, How to apply, then Member sign in and Book a visit"><figcaption>Tap any link to go there</figcaption></figure>
  </div>
</section>

<section id="close" data-part="2" data-cue="While the list is open, the button at the top says Close.">
  <div class="heading-row"><h2>2 · Tap “Close”</h2></div>
  <div class="pics">
    <figure><img class="shot h640" src="images/public-landing-menu-360.png" alt="The open menu with a Close button at the top right"><figcaption>The Escape key closes it too</figcaption></figure>
  </div>
</section>

<section id="summary" data-part="3" data-cue="So, in short.">
  <h2>In short</h2>
  <ol class="steps">
    <li><span class="num">1</span>Tap “Menu”</li>
    <li><span class="num">2</span>Tap a link</li>
    <li><span class="num">3</span>Tap “Close”</li>
  </ol>
</section>

<section id="thanks" data-part="4" data-cue="Thank you for watching.">
  <div class="cols">
    <div>
      <h1>Thank you</h1>
      <p class="lead">Questions, however small, are welcome.</p>
    </div>
    <img class="art" src="../../../mocks/assets/own/garden.svg" alt="A rooftop garden">
  </div>
</section>

<script src="../../assets/slides.js"></script>
</body>
</html>
