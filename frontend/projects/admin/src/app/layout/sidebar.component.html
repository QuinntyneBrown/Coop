<a class="sidebar__brand" routerLink="/dashboard">
  <span class="logo-mark" aria-hidden="true">
    <svg viewBox="0 0 48 48" aria-hidden="true" data-testid="sidebar-logo">
      <rect width="48" height="48" rx="14" class="logo-mark__tile" />
      <circle cx="17" cy="27" r="8" class="logo-mark__left" />
      <circle cx="31" cy="27" r="8" class="logo-mark__right" />
      <circle cx="24" cy="17" r="8" class="logo-mark__top" />
    </svg>
  </span>
  <span data-testid="sidebar-app-title">OWN Housing Co-op</span>
</a>
<nav class="sidebar__nav" aria-label="Admin sections">
  @for (link of links; track link.path) {
    <a
      class="nav-link"
      [routerLink]="link.path"
      routerLinkActive
      ariaCurrentWhenActive="page"
      [attr.data-testid]="'sidebar-nav-' + link.testId"
      [attr.data-active]="isActive(link.path)"
    >
      <svg [libIcon]="link.icon"></svg>{{ link.label }}
    </a>
  }
</nav>
<div class="sidebar__footer" data-testid="sidebar-user-info">
  <span libAvatar size="sm" aria-hidden="true" data-testid="sidebar-user-avatar">{{
    userInitial
  }}</span>
  <div class="sidebar__user">
    <span class="sidebar__user-name" data-testid="sidebar-user-name">{{ username }}</span>
    <span class="sidebar__user-role" data-testid="sidebar-user-role">{{ role() }}</span>
  </div>
</div>
