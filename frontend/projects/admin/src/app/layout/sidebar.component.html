<aside libSidebar aria-label="Admin" data-testid="sidebar">
  <a libSidebarBrand [routerLink]="dashboardPath">
    <span libLogoMark data-testid="sidebar-logo"></span>
    <span data-testid="sidebar-app-title">OWN Housing Co-op</span>
  </a>
  <nav libSidebarNav aria-label="Admin sections">
    @for (group of groups(); track $index) {
      @if (group.heading) {
        <span libSidebarGroup aria-hidden="true" data-testid="sidebar-group">{{
          group.heading
        }}</span>
      }
      @for (link of group.links; track link.path) {
        <a
          libNavLink
          [routerLink]="link.path"
          routerLinkActive
          ariaCurrentWhenActive="page"
          [attr.data-testid]="'sidebar-nav-' + link.testId"
          [attr.data-active]="isActive(link.path)"
        >
          <svg [libIcon]="link.icon"></svg>{{ link.label }}
        </a>
      }
    }
  </nav>
  <div libSidebarFooter data-testid="sidebar-user-info">
    <span libAvatar size="sm" aria-hidden="true" data-testid="sidebar-user-avatar">{{
      userInitial
    }}</span>
    <div libSidebarUser>
      <span libSidebarUserName data-testid="sidebar-user-name">{{ username }}</span>
      <span libSidebarUserRole data-testid="sidebar-user-role">{{ role() }}</span>
    </div>
  </div>
</aside>
