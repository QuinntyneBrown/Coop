<main id="main" class="auth-layout">
  <div class="auth-card stack">
    <div class="logo">
      <span libLogoMark></span>
    </div>
    <div libCard class="stack">
      <h1 class="forgot-heading">Forgot Password</h1>
      <p class="text-muted forgot-centred">
        Enter your username and we'll help you reset your password.
      </p>
      <form
        class="stack"
        novalidate
        aria-label="Reset password"
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
      >
        <div libFormField>
          <label libFieldLabel for="username">Username</label>
          <input
            libTextField
            id="username"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            formControlName="username"
            placeholder="Enter your username"
            data-testid="forgot-username"
          />
        </div>
        <button
          type="submit"
          libButton
          variant="primary"
          size="lg"
          block
          data-testid="forgot-submit-btn"
        >
          Reset Password
        </button>
        <p class="forgot-centred"><a routerLink="/login">Back to Sign In</a></p>
      </form>
    </div>
  </div>
</main>
