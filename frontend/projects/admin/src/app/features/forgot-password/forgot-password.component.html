<main id="main" class="auth-layout">
  <div class="auth-card stack">
    <div class="logo">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <rect width="48" height="48" rx="14" style="fill: var(--color-accent)" />
          <circle cx="17" cy="27" r="8" style="fill: var(--color-accent-subtle)" />
          <circle cx="31" cy="27" r="8" style="fill: var(--color-accent-subtle-hover)" />
          <circle cx="24" cy="17" r="8" style="fill: var(--color-bg-surface)" />
        </svg>
      </span>
    </div>
    <div class="card stack">
      <h1 class="forgot-heading">Forgot Password</h1>
      <p class="text-muted forgot-centred">
        Enter your username and we'll help you reset your password.
      </p>
      <form
        class="stack"
        novalidate
        aria-label="Reset password"
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
      >
        <div class="field">
          <label class="field__label" for="username">Username</label>
          <input
            class="input"
            id="username"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            formControlName="username"
            placeholder="Enter your username"
            data-testid="forgot-username"
          />
        </div>
        <button
          type="submit"
          libButton
          variant="primary"
          size="lg"
          block
          data-testid="forgot-submit-btn"
        >
          Reset Password
        </button>
        <p class="forgot-centred"><a routerLink="/login">Back to Sign In</a></p>
      </form>
    </div>
  </div>
</main>
