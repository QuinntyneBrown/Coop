<main id="main" class="auth-layout">
  <div class="auth-card stack">
    <div class="stack login-brand" data-testid="login-hero-panel">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg
            viewBox="0 0 48 48"
            aria-hidden="true"
            focusable="false"
            data-testid="login-hero-icon"
          >
            <rect width="48" height="48" rx="14" style="fill: var(--color-accent)" />
            <circle cx="17" cy="27" r="8" style="fill: var(--color-accent-subtle)" />
            <circle cx="31" cy="27" r="8" style="fill: var(--color-accent-subtle-hover)" />
            <circle cx="24" cy="17" r="8" style="fill: var(--color-bg-surface)" />
          </svg>
        </span>
      </div>
      <p class="text-caption login-centred">
        <span data-testid="login-hero-title">OWN Housing Co-op</span> ·
        <span data-testid="login-hero-description">Cooperative management</span>
      </p>
    </div>

    <div class="card stack" data-testid="login-form-panel">
      <h1 class="login-heading" data-testid="login-heading">Welcome back</h1>
      <p class="text-muted login-centred" data-testid="login-subtitle">
        Sign in to your account to continue
      </p>

      <form
        class="stack"
        novalidate
        aria-label="Sign in"
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
      >
        @if (loginError) {
          <div class="alert alert--danger" role="alert" data-testid="login-form-error">
            <svg appIcon="error"></svg>
            <div class="alert__body">{{ loginError }}</div>
          </div>
        }

        <div class="field">
          <label class="field__label" for="username">Username</label>
          <input
            class="input"
            id="username"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            formControlName="username"
            data-testid="login-username"
            placeholder="Enter your username"
            [attr.aria-invalid]="usernameInvalid || null"
            [attr.aria-describedby]="usernameInvalid ? 'username-error' : null"
          />
          @if (usernameInvalid) {
            <p class="field__error" id="username-error" data-testid="login-username-error">
              Username is required
            </p>
          }
        </div>

        <div class="field">
          <label class="field__label" for="password">Password</label>
          <input
            class="input"
            id="password"
            type="password"
            autocomplete="current-password"
            formControlName="password"
            data-testid="login-password"
            placeholder="Enter your password"
            [attr.aria-invalid]="passwordInvalid || null"
            [attr.aria-describedby]="passwordInvalid ? 'password-error' : null"
          />
          @if (passwordInvalid) {
            <p class="field__error" id="password-error" data-testid="login-password-error">
              Password is required
            </p>
          }
        </div>

        <div class="cluster cluster--between">
          <label class="checkbox">
            <input type="checkbox" formControlName="rememberMe" data-testid="login-remember-me" />
            <span class="checkbox__text">Remember me</span>
          </label>
          <a routerLink="/forgot-password" data-testid="login-forgot-password">Forgot password?</a>
        </div>

        <button
          type="submit"
          class="btn btn--primary btn--lg btn--block"
          data-testid="login-submit"
          [disabled]="loading"
          [attr.aria-busy]="loading || null"
        >
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>

        <p class="text-muted">
          Don't have an account?
          <a routerLink="/register" data-testid="login-signup-link">Sign up</a>
        </p>
      </form>
    </div>
  </div>
</main>
